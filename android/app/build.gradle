apply plugin: 'com.android.application'

android {
    namespace "com.thanapat.assaultcube"
    compileSdkVersion 34
    ndkVersion "26.3.11579264"

    defaultConfig {
        applicationId "com.thanapat.assaultcube"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName System.getenv("VERSION_NAME") ?: "1.3.0-android"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static", "-DANDROID_PLATFORM=android-21"
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }

    signingConfigs {
        release {
            // public key for personal builds, so every CI build installs over the previous one
            storeFile file('release.keystore')
            storePassword 'assaultcube'
            keyAlias 'assaultcube'
            keyPassword 'assaultcube'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.22.1'
        }
    }

    androidResources {
        // keep game data uncompressed-friendly and include dot files
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
}
