name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.3.0-android.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Fetch libraries
        run: scripts/fetch-deps.sh

      - name: Pack game data
        run: scripts/prepare-assets.sh

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/AssaultCube-Android-${VERSION_NAME}.apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: AssaultCube-Android
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: AssaultCube Android ${{ env.VERSION_NAME }}
          body: |
            APK build from commit ${{ github.sha }}.
            Download the .apk below and install it on your phone (allow "install unknown apps").
          files: out/*.apk
